enable
configure terminal
 
! Turn the 3560 into a Layer 3 device
ip routing
 
! Zona 1 PASEO_COMERCIAL, 60 hosts, /26
interface vlan 19
 description GW_PASEO_COMERCIAL
 ip address 10.149.19.1 255.255.255.192
 no shutdown
 exit
 
! Zona 2 CENTRO_CONTROL, 28 hosts, /27
interface vlan 29
 description GW_CENTRO_CONTROL
 ip address 10.149.29.1 255.255.255.224
 no shutdown
 exit
 
! Zona 3 DISTRITO_MODA, 12 hosts, /28
interface vlan 39
 description GW_DISTRITO_MODA
 ip address 10.149.39.1 255.255.255.240
 no shutdown
 exit
 
! Zona 4 DISTRITO_EMPRESARIAL, 50 hosts, /26
interface vlan 49
 description GW_DISTRITO_EMPRESARIAL
 ip address 10.149.49.1 255.255.255.192
 no shutdown
 exit
 
! Zona 5 LIRIOS_RESIDENCIAL, 7 hosts, /28
interface vlan 59
 description GW_LIRIOS_RESIDENCIAL
 ip address 10.149.59.1 255.255.255.240
 no shutdown
 exit
 
end
copy running-config startup-config